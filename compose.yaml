services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tvlore
      POSTGRES_USER: tvlore
      POSTGRES_PASSWORD: tvlore
    ports:
      - "5432:5432"
    volumes:
      - tvlore-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tvlore -d tvlore"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  tvlore-postgres-data:
